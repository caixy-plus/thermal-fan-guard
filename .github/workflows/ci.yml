name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Swift test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: thermal-fan-guard

      - uses: actions/checkout@v4
        with:
          repository: agoodkind/macos-smc-fan
          path: thermal-fan-guard-vendor

      - name: Run tests
        working-directory: thermal-fan-guard
        run: swift test

      - name: Verify app icon packaging
        working-directory: thermal-fan-guard
        run: ./Tests/PackagingTests/AppIconPackagingTests.sh

      - name: Verify release packaging contracts
        working-directory: thermal-fan-guard
        run: |
          zsh Tests/PackagingTests/ReleaseSigningTests.sh
          zsh Tests/PackagingTests/ReleaseWorkflowTests.sh
